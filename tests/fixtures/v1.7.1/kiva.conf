# KivaDB configuration

[storage]
auto_compact = true
cache_size_mb = 256
cache_values = false
compact_threshold = 30
compression = lz4
default_workspace = @HOME@/data
max_memory_mb = 0
snapshot_every = 1000
snapshot_interval = 300
sync_writes = false

[workspaces]
shop = @HOME@/workspaces/shop
u_ana = @HOME@/workspaces/u_ana
u_guest = @HOME@/workspaces/u_guest

[network]
bind = 127.0.0.1
port = 2911

[security]
auth_required = false

[server]
max_clients = 1000
threads = 8

[http]
cors = true
enabled = true
port = 8080
rate_limit = 600
stream = true

[resp]
enabled = true
max_collection_members = 100000
port = 6379

[tls]
cert = 
enabled = true
hosts = 
key = 
required = false

[replication]
master_fingerprint = 
master_host = 
master_password = 
master_port = 2911
master_tls = false
master_user = kiva
min_slaves_ack = 1
role = master
sync_mode = async

[scripting]
memory_limit_mb = 64
timeout_ms = 5000

[encryption]
key_file = 
old_key_file = 
required = false

[failover]
auto = false
down_after_ms = 5000
epoch = 0
heartbeat_ms = 1000
node_id = 
nodes = 
priority = 100
quorum = 0
voted = 0

[semantic]
cache.enabled = false
cache.max_entries = 10000
cache.threshold = 0.98
cache.ttl = 300

[vector]
max_ram_mb = auto
