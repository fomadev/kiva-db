name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output_name: kivadb_win_x64
            binary: kivadb.exe

          - os: macos-latest
            os-name: macos
            arch: arm64
            output_name: kivadb_mac_arm64
            binary: kivadb

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output_name: kivadb_linux_x64
            binary: kivadb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Compile KivaDB
        run: cargo build --release

      # --- Archivage ---
      - name: Archive Binary
        shell: bash
        run: |
          # The file inside the archive is always "kivadb" (or kivadb.exe);
          # the archive name carries the platform.
          cd target/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../${{ matrix.output_name }}.zip ${{ matrix.binary }}
            echo "ASSET=${{ matrix.output_name }}.zip" >> $GITHUB_ENV
          else
            tar -czvf ../../${{ matrix.output_name }}.tar.gz ${{ matrix.binary }}
            echo "ASSET=${{ matrix.output_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}
