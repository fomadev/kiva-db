name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output_name: kivadb_win_x64
            binary_ext: .exe

          - os: macos-latest 
            os-name: macos
            arch: arm64
            output_name: kivadb_mac_arm64
            binary_ext: ""

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output_name: kivadb_linux_x64
            binary_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Configuration Windows (MSYS2) ---
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      # --- Compilation ---
      - name: Compile KivaDB
        shell: bash
        run: |
          mkdir -p obj
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows : Compilation statique avec MinGW[cite: 11]
            mingw32-make
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # macOS : Pas de statique, utilisation de Clang[cite: 10]
            make CC=clang CXX=clang++ LDFLAGS="-lstdc++"
          else
            # Linux : Compilation standard[cite: 11]
            make
          fi
          
          # On uniformise le nom du binaire produit par le Makefile (kivadb.exe)[cite: 11]
          # vers un nom simple 'kivadb' (ou 'kivadb.exe' sur Windows)
          if [ -f "kivadb.exe" ]; then
            if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
               mv kivadb.exe kivadb
            fi
          fi

      # --- Archivage intelligent ---
      - name: Archive Binary
        shell: bash
        run: |
          # Le nom du fichier à l'intérieur de l'archive sera "kivadb" (ou kivadb.exe)
          # Mais le nom du pack (l'archive) contiendra l'architecture.
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Archive : kivadb_win_x64.zip | Contenu : kivadb.exe
            7z a ${{ matrix.output_name }}.zip kivadb.exe
            echo "ASSET=${{ matrix.output_name }}.zip" >> $GITHUB_ENV
          else
            # Archive : kivadb_macos_arm64.tar.gz | Contenu : kivadb
            tar -czvf ${{ matrix.output_name }}.tar.gz kivadb
            echo "ASSET=${{ matrix.output_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}