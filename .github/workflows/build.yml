name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output: kivadb_win_x64

          - os: macos-latest 
            os-name: macos
            arch: arm64
            output: kivadb_mac_arm64

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output: kivadb_linux_x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Configuration Windows (MSYS2) ---
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      # --- Compilation ---
      - name: Compile KivaDB
        shell: bash
        run: |
          mkdir -p obj
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows : Compilation avec MinGW
            mingw32-make
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # macOS : Utilisation de clang et interdiction du statique
            make CC=clang CXX=clang++ LDFLAGS="-lstdc++"
          else
            # Linux : Compilation standard via le Makefile
            make
          fi
          
          # Note : On ne renomme PAS le binaire ici pour garder le nom standard (kivadb).

      # --- Archivage intelligent ---
      - name: Archive Binary
        shell: bash
        run: |
          # Définition du nom de l'exécutable produit par le Makefile
          BINARY_NAME="kivadb"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BINARY_NAME="kivadb.exe"
            
            # On crée un ZIP nommé selon l'architecture contenant le binaire standard
            7z a ${{ matrix.output }}.zip $BINARY_NAME
            echo "ASSET=${{ matrix.output }}.zip" >> $GITHUB_ENV
          else
            # On crée un tar.gz nommé selon l'architecture contenant le binaire standard
            # tar conserve les permissions d'exécution sur Linux/macOS
            tar -czvf ${{ matrix.output }}.tar.gz $BINARY_NAME
            echo "ASSET=${{ matrix.output }}.tar.gz" >> $GITHUB_ENV
          fi

      # --- Publication de l'artéfact ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}