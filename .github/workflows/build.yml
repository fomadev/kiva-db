name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output: kivadb_win_x64.exe

          - os: macos-latest 
            os-name: macos
            arch: arm64
            output: kivadb_mac_arm64

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output: kivadb_linux_x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Configuration Windows (MSYS2) ---
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      # --- Compilation ---
      - name: Compile KivaDB
        shell: bash
        run: |
          # Création du dossier d'objets requis par le Makefile
          mkdir -p obj
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Compilation avec MinGW sur Windows[cite: 9]
            mingw32-make
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Force Clang pour macOS
            make CC=clang CXX=clang++
          else
            # Compilation standard Linux[cite: 9]
            make
          fi
          
          # Renommage du binaire final selon la matrice
          if [ -f "kivadb.exe" ]; then
            mv kivadb.exe ${{ matrix.output }}
          elif [ -f "kivadb" ]; then
            mv kivadb ${{ matrix.output }}
          fi

      # --- Archivage pour préserver les permissions (chmod +x) ---
      - name: Archive Binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Format ZIP pour Windows
            zip ${{ matrix.output }}.zip ${{ matrix.output }}
            echo "ASSET=${{ matrix.output }}.zip" >> $GITHUB_ENV
          else
            # Format tar.gz pour Linux/Mac afin de garder les droits d'exécution
            tar -czvf ${{ matrix.output }}.tar.gz ${{ matrix.output }}
            echo "ASSET=${{ matrix.output }}.tar.gz" >> $GITHUB_ENV
          fi

      # --- Upload de l'artéfact final ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}