#
# On every push and pull request: lint and test on Windows, Linux and macOS.
# On a version tag (git tag v1.0.0 && git push origin v1.0.0): the same, then
# a GitHub release with the executables, and the Docker image on Docker Hub.
#
# Docker Hub needs two repository secrets (Settings > Secrets and variables >
# Actions): DOCKER_USERNAME (fomadev0) and DOCKER_PASSWORD (a Docker access token).

name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output_name: kivadb_win_x64
            binary: kivadb.exe

          - os: macos-latest
            os-name: macos
            arch: arm64
            output_name: kivadb_mac_arm64
            binary: kivadb

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output_name: kivadb_linux_x64
            binary: kivadb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Test the Node.js driver
        if: matrix.os-name == 'linux'
        shell: bash
        run: |
          cd drivers/node
          KIVADB_BIN="$GITHUB_WORKSPACE/target/debug/kivadb" npm test

      - name: Compile KivaDB
        run: cargo build --release

      # --- Archivage ---
      - name: Archive Binary
        shell: bash
        run: |
          # The file inside the archive is always "kivadb" (or kivadb.exe);
          # the archive name carries the platform.
          cd target/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../${{ matrix.output_name }}.zip ${{ matrix.binary }}
            echo "ASSET=${{ matrix.output_name }}.zip" >> $GITHUB_ENV
          else
            tar -czvf ../../${{ matrix.output_name }}.tar.gz ${{ matrix.binary }}
            echo "ASSET=${{ matrix.output_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: KivaDB ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

  docker:
    name: Docker Hub image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Version number
        # v1.0.0 -> 1.0.0, the usual form of Docker tags.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kiva-db:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/kiva-db:latest
