name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows ---
          - os: windows-latest
            os-name: windows
            arch: x64
            output: kivadb_win_x64.exe

          # --- macOS ---
          - os: macos-latest 
            os-name: macos
            arch: arm64
            output: kivadb_mac_arm64

          # --- Linux (Ubuntu/Debian/Kali/etc) ---
          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output: kivadb_linux_x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup pour Windows (on utilise MinGW pour rester compatible avec ton Makefile gcc/g++)
      - name: Setup MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      # Compilation universelle via le Makefile
      - name: Compile KivaDB
        shell: bash
        run: |
          # On s'assure que le dossier obj existe
          mkdir -p obj
          
          # On utilise le Makefile que tu as déjà configuré
          # Il va compiler api.c, engine.c, format_v2.c, storage.c, etc.
          make
          
          # On renomme l'exécutable généré (kivadb.exe) vers le nom spécifique à la matrice
          if [ -f "kivadb.exe" ]; then
            mv kivadb.exe ${{ matrix.output }}
          elif [ -f "kivadb" ]; then
            mv kivadb ${{ matrix.output }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ matrix.output }}