name: Multi-Architecture Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    name: Build for ${{ matrix.os-name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            arch: x64
            output: kivadb_win_x64.exe

          - os: macos-latest 
            os-name: macos
            arch: arm64
            output: kivadb_mac_arm64

          - os: ubuntu-latest
            os-name: linux
            arch: x64
            output: kivadb_linux_x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Configuration Windows (MSYS2) ---
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      # --- Compilation ---
      - name: Compile KivaDB
        shell: bash
        run: |
          mkdir -p obj
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows : On garde le statique car MinGW le permet
            mingw32-make
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # macOS : INTERDICTION du statique (LDFLAGS vide pour éviter -static)[cite: 10]
            make CC=clang CXX=clang++ LDFLAGS="-lstdc++"
          else
            # Linux : Compilation standard statique[cite: 10]
            make
          fi
          
          # Renommage du binaire
          if [ -f "kivadb.exe" ]; then
            mv kivadb.exe ${{ matrix.output }}
          elif [ -f "kivadb" ]; then
            mv kivadb ${{ matrix.output }}
          fi

      # --- Archivage intelligent ---
      - name: Archive Binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Utilisation de 7z car 'zip' est absent sur GitHub Windows Runner
            7z a ${{ matrix.output }}.zip ${{ matrix.output }}
            echo "ASSET=${{ matrix.output }}.zip" >> $GITHUB_ENV
          else
            # tar.gz pour Linux et Mac (garde les permissions)
            tar -czvf ${{ matrix.output }}.tar.gz ${{ matrix.output }}
            echo "ASSET=${{ matrix.output }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivadb-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ${{ env.ASSET }}