[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kivadb"
# The driver has its own version numbers, apart from the server's
# (README.md, "Versions"). Keep it equal to kivadb.__version__.
version = "1.0.0"
description = "Official Python driver for KivaDB (binary protocol, no dependencies)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fordi / FomaDev" }]
keywords = ["kivadb", "database", "key-value", "document", "vector", "driver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/fomadev/kiva-db"
Documentation = "https://github.com/fomadev/kiva-db/tree/main/drivers/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kivadb = ["py.typed"]
