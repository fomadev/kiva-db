[package]
name = "kivadb"
version = "2.0.0-rc.2"
edition = "2021"
description = "KivaDB - a typed, persistent key-value and document database engine"
authors = ["Fordi / FomaDev"]
license-file = "LICENSE"
repository = "https://github.com/fomadev/kiva-db"
readme = "README.md"

[lib]
name = "kivadb"
path = "src/lib.rs"

[[bin]]
name = "kivadb"
path = "src/main.rs"

[[bench]]
name = "queries"
harness = false

[[bench]]
name = "versions"
harness = false

[dependencies]
crc32fast = "1"
lz4_flex = "0.11"
flate2 = "1"
# float_roundtrip: a float read from JSON text is the one the text names, to
# the last bit (the default parser may be one unit off in the last place).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Documents keep their members in the order they were written.
indexmap = "2"
# Exact decimals (`decimal`): a 96-bit integer and a scale of 0 to 28.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rmp-serde = "1"
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
# Schema patterns: linear time whatever the expression, with a size bound.
regex = "1"
rpassword = "7"
rustyline = { version = "15", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
opt-level = 3
lto = "thin"

# Dependencies (hashing, compression, Lua) are optimised even in debug builds
# so that the test suite stays fast.
[profile.dev.package."*"]
opt-level = 2
